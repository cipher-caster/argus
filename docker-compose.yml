services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATA_PROVIDER=binance
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://argus:argus_password@db:5432/argus_db
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - db
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      - DATA_PROVIDER=binance
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://argus:argus_password@db:5432/argus_db
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=argus
      - POSTGRES_PASSWORD=argus_password
      - POSTGRES_DB=argus_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
