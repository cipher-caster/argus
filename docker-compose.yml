services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATA_PROVIDER=okx
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:-argus_password}@db:5432/${POSTGRES_DB:-argus_db}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - db
    restart: unless-stopped

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      - DATA_PROVIDER=okx
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-argus}:${POSTGRES_PASSWORD:-argus_password}@db:5432/${POSTGRES_DB:-argus_db}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-argus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-argus_password}
      - POSTGRES_DB=${POSTGRES_DB:-argus_db}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
